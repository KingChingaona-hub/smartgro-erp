on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Reset Database Passwords
        env:
          DATABASE_URL: postgresql://postgres:R234715KING@ep-orange-block-abu8uif3.eu-west-2.aws.neon.tech/smartgro?sslmode=require
        run: |
          psql "$DATABASE_URL" -c "UPDATE users SET password = CASE WHEN role = 'admin' THEN 'admin123' WHEN role = 'manager' THEN 'manager123' WHEN role = 'cashier' THEN 'cash123' WHEN role = 'owner' THEN 'owner123' ELSE password END;"
          echo "✅ Passwords reset successfully!"
