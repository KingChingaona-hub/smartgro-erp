name: Reset Passwords

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary

      - name: Reset Database Passwords
        env:
          DATABASE_URL: postgresql://postgres:R234715KING@ep-orange-block-abu8uif3.eu-west-2.aws.neon.tech/smartgro?sslmode=require
        run: |
          python -c "
          import os
          import psycopg2
          from urllib.parse import urlparse
          
          db_url = os.environ.get('DATABASE_URL')
          if not db_url:
              print('No DATABASE_URL found')
              exit(1)
          
          parsed = urlparse(db_url)
          conn = psycopg2.connect(
              host=parsed.hostname,
              port=parsed.port or 5432,
              database=parsed.path.lstrip('/'),
              user=parsed.username,
              password=parsed.password,
              sslmode='require'
          )
          
          cur = conn.cursor()
          
          # Reset passwords
          cur.execute('''
              UPDATE users 
              SET password = CASE 
                  WHEN role = 'admin' THEN 'admin123'
                  WHEN role = 'manager' THEN 'manager123'
                  WHEN role = 'cashier' THEN 'cash123'
                  WHEN role = 'owner' THEN 'owner123'
                  ELSE password
              END
          ''')
          
          conn.commit()
          
          # Show users
          cur.execute('SELECT username, role FROM users')
          users = cur.fetchall()
          
          cur.close()
          conn.close()
          
          print('✅ Passwords reset successfully!')
          print('Users:')
          for user in users:
              print(f'  - {user[0]} ({user[1]})')
          "
